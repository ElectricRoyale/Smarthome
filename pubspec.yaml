  web_socket_channel: ^2.2.0
  syncfusion_flutter_charts: ^20.2.48
  animated_toggle_switch: ^0.5.2
  weather: ^2.0.1
  dropdown_button2: 1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.2.0
  hive_generator: ^1.1.3
  flutter_lints: ^2.0.1

